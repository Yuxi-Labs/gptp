name: Validate GPTP schema

on:
  push:
    paths:
      - "schema/gptp.schema.json"
      - "docs/examples/**/*.gptp"
      - ".github/workflows/validate-schema.yml"
  pull_request:
    paths:
      - "schema/gptp.schema.json"
      - "docs/examples/**/*.gptp"
      - ".github/workflows/validate-schema.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install formats plugin so we can require it in ajv-cli@5
      - name: Install ajv-formats
        run: npm install --no-save ajv-formats

      # 1) Meta-validate the schema (allow union types, enable formats via ajv-formats)
      - name: Compile (meta-validate) schema
        run: |
          npx -y ajv-cli@5 compile \
            --spec=draft7 \
            --allow-union-types \
            --require=ajv-formats \
            -s schema/gptp.schema.json

      # 2) Validate all example .gptp files (if any)
      - name: Validate examples against schema
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(docs/examples/**/*.gptp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gptp files in docs/examples/. Skipping data validation."
            exit 0
          fi
          # Pass the expanded list of files to ajv validate
          npx -y ajv-cli@5 validate \
            --spec=draft7 \
            --allow-union-types \
            --require=ajv-formats \
            -s schema/gptp.schema.json \
            -d ${files[@]}
