name: Validate GPTP schema

on:
  push:
    paths:
      - "schema/gptp.schema.json"
      - "docs/examples/**/*.gptp"
      - ".github/workflows/validate-schema.yml"
  pull_request:
    paths:
      - "schema/gptp.schema.json"
      - "docs/examples/**/*.gptp"
      - ".github/workflows/validate-schema.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # install formats plugin in CJS flavor so ajv-cli@5 can require() it
      - name: Install ajv-formats (CJS)
        run: |
          npm install --no-save ajv-formats@2.1.1

      # 1) Meta-validate the schema
      - name: Compile (meta-validate) schema
        run: |
          npx -y ajv-cli@5 compile \
            --spec=draft7 \
            --allow-union-types \
            -c ajv-formats \
            -s schema/gptp.schema.json

      # 2) Validate all example .gptp files (if any)
      - name: Validate examples against schema
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(docs/examples/**/*.gptp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .gptp files in docs/examples/. Skipping data validation."
            exit 0
          fi
          npx -y ajv-cli@5 validate \
            --spec=draft7 \
            --allow-union-types \
            -c ajv-formats \
            -s schema/gptp.schema.json \
            -d "docs/examples/**/*.gptp"
