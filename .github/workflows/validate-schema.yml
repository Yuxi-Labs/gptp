name: Validate GPTP schema

on:
  push:
    paths:
      - "schema/gptp.schema.json"
      - "docs/examples/**/*.gptp"
      - ".github/workflows/validate-schema.yml"
  pull_request:
    paths:
      - "schema/gptp.schema.json"
      - "docs/examples/**/*.gptp"
      - ".github/workflows/validate-schema.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AJV CLI and formats
        run: |
          npm install --no-save ajv-cli@5.0.0 ajv-formats@1.6.1

      - name: Compile (meta-validate) schema
        run: |
          npx ajv compile \
            --spec=draft7 \
            --allow-union-types \
            -c ajv-formats \
            -s schema/gptp.schema.json

      - name: Validate examples against schema
        run: |
          count=$(find docs/examples -name '*.gptp' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No .gptp files in docs/examples/. Skipping data validation."
            exit 0
          fi

          npx ajv validate \
            --spec=draft7 \
            --allow-union-types \
            -c ajv-formats \
            -s schema/gptp.schema.json \
            -d "docs/examples/**/*.gptp"

      - name: Cleanup
        run: rm -rf node_modules package-lock.json
